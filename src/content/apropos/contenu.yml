duo:
  titre: Deux parcours et une même vision du coaching.
  accroche: Viens, on rêve ?
  texte: >
    Endurall est né comme beaucoup de nos idées un peu folles : pendant un run.


    Avec Elo, on a ce truc de rarement se dire non. Un Ironman ? Carrément. L'Ultra Marin ? Évidemment. Monter notre boîte ensemble ? Allez, on le fait !


    Endurall c’est une histoire d’amitié sincère, de passion partagée pour les sports d’endurance. 


    On vibre au rythme des défis, pour les expériences sportives. Mais, le sport ce n’est pas qu’une histoire de performance.  Le sport, on l’aime surtout pour l’aventure qu’il représente, pour les émotions immenses qu’il peut susciter.  


    Alors, on a monté Endurall pour vous faire rêver à votre tour : de courir 30 minutes sans suffoquer à performer sur un Ironman ou à donner vie à ce défi un peu fou qui vous trotte dans la tête. 


    Nous on rêve déjà..
  photo: /images/uploads/20260517_142134.jpg
coachs:
  - accroche: « Parce que parfois il suffit qu'on croit en nous pour accomplir ce
      que l'on pensait impossible. »
    rapport_au_sport: "Le sport a toujours occupé une place importante dans ma vie.
      Football, athlétisme, triathlon puis course à pied : j'ai grandi avec
      cette envie de bouger, de progresser et de me dépasser. Mais c'est surtout
      la course à pied qui a changé ma vie. En 2018, je me lance le défi de
      courir un marathon alors que mon mode de vie est bien loin de celui d'un
      sportif (tabac, alcool, 103 kg). Ce défi marque le début d'une
      transformation et me fait découvrir tout ce que le sport peut apporter,
      bien au-delà de la performance."
    vision: Pour moi, coacher ne consiste pas simplement à envoyer un programme
      d'entraînement. C'est comprendre la personne derrière le sportif, son
      quotidien, ses contraintes, ses doutes et ses ambitions. C'est expliquer,
      écouter, ajuster, encourager et parfois savoir freiner. Je veux que chaque
      personne que j'accompagne comprenne ce qu'elle fait, devienne
      progressivement plus autonome et prenne confiance en ses capacités. Parce
      qu'un objectif sportif peut sembler anodin sur le papier, mais peut
      devenir quelque chose de beaucoup plus grand quand on décide de se lancer.
    prenom: Guigui
    parcours: >-
      Après plusieurs années d'athlétisme et une première expérience du
      triathlon plus jeune, je retrouve véritablement le sport à travers la
      course à pied en 2018. Depuis, les kilomètres et les défis se sont
      enchaînés : du 5 km au marathon, avec une recherche constante de
      progression, et une envie d'aller chercher plus loin encore (bientôt sur
      ultra endurance).


      En parallèle, j'ai travaillé pendant près de 8 ans comme Business Analyst. Une première carrière qui m'a beaucoup appris, mais dans laquelle il me manquait quelque chose d'essentiel : du sens. J'ai alors choisi de changer de voie pour faire du sport et de l'accompagnement mon métier.
    diplomes:
      - CQP IF Double mention Musculation Personal Training et Cours Collectifs
    photo: /images/photos/guillaume.webp
    specialites:
      - Course à pied
      - Préparation physique
    pourquoi_coach: "Parce que quelqu'un a cru en moi avant que j'y croie moi-même.
      Lorsque mon frère m'a proposé de courir un marathon, je ne pensais pas en
      être capable. Pourtant, ce simple défi a profondément changé ma vie.
      Aujourd'hui, j'ai envie d'être cette personne pour les autres : celle qui
      aide à croire en un objectif, à révéler un potentiel et à accomplir
      quelque chose qui paraissait parfois inaccessible. Devenir coach, c'est
      mettre ma passion du sport, mon empathie et mon envie d'aider les autres
      au service de cette mission."
  - accroche: « Parce qu'on peut commencer sans aimer ça, sans être doué et sans se
      sentir légitime… et finir par changer sa vie. »
    rapport_au_sport: Le sport d’endurance n'a pas été une évidence pour moi.… loin
      de là. J’ai commencé la course à pied pour arrêter de fumer ! Courir 15min
      était une épreuve, je n’avais ni le cardio, ni l’endurance ni la
      musculature requise. En revanche, courir a  immédiatement réveillé en moi
      cette volonté de me dépasser, de me prouver que j’étais capable de ce qui
      relevait, alors, de l’impensable. A force de persévérance, d’une épreuve
      est devenue une nécessité, un besoin. Le sport d’endurance a changé ma
      vie.
    vision: Pour moi, le coaching ne se résume pas à la performance ou à un chrono.
      Bien sûr, j'aime les challenges et cette envie d'aller chercher toujours
      un peu plus loin, mais je veux surtout accompagner chaque personne dans
      son propre parcours. Comprendre d'où elle part, ce qui la motive, ce qui
      lui fait peur et ce qu'elle veut accomplir. Construire progressivement,
      transmettre mes connaissances et lui donner les outils pour progresser et
      prendre confiance.
    prenom: Elo
    parcours: >-
      Après quelques années à courir sans structure ni objectif, à m’entraîner
      en dilettante, une inscription hasardeuse à la première édition du T24 en
      2021 est venue changer ma pratique. j’ai découvert une discipline mais
      surtout, une passion. 


      A partir de 2023, le loisir devenait passion et mon quotidien se construisait autour des sports d’endurance. Je me suis inscrite à mes premières courses d’endurance (marathon, triathlon) avec une participation significative au T24 de l’Ile de Ré en individuel, expérience qui m’a marquée pour l’adrénaline, l’introspection et le dépassement de soi. 


      Carrière dans l’humanitaire avec une première mission en Afghanistan. 
    diplomes:
      - CQP IF Double mention Musculation Personal Training et Cours Collectifs
    photo: /images/photos/elo.webp
    specialites:
      - Course à pied
      - Triathlon
      - Préparation physique
    pourquoi_coach: Dans une période où j'avais perdu une partie de mes repères, le
      sport m'a permis de retrouver des objectifs, de l'accomplissement et une
      forme d'alignement. C'est aussi ça que j'ai envie de transmettre
      aujourd'hui. Parce que je sais ce que c'est de commencer sans être
      sportive, de ne pas aimer courir, d'avoir peur sur un vélo ou simplement
      de penser que certaines choses ne sont pas faites pour soi. Je veux
      montrer qu'on n'a pas besoin d'avoir toujours été sportif pour se lancer,
      progresser et découvrir jusqu'où on est capable d'aller.
contact_intro: "Un message, et on s'occupe du reste. Dis-nous où tu en es et où
  tu veux aller : on te recontacte pour en parler."
