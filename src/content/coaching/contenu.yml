intro: "Choisis d'abord ce que tu veux travailler, puis la formule d'accompagnement qui te convient."
disciplines:
  - id: "course"
    titre: "Course à pied"
    resume: "Du premier objectif running jusqu'à la préparation de compétitions : 5 km, 10 km, semi-marathon, marathon, trail ou simplement courir mieux et plus régulièrement."
