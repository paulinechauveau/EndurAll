offres_intro: "Deux formules pour t'accompagner, selon le suivi dont tu as besoin."
etapes:
  - titre: "Prise de contact"
    texte: "Tu nous contactes via Instagram, par e-mail ou depuis le site."
  - titre: "Formulaire"
    texte: "Tu complètes un formulaire pour qu'on comprenne ton profil, ta pratique et ton objectif."
  - titre: "Échange"
    texte: "Un appel pour faire connaissance, préciser ton besoin et choisir l'accompagnement adapté."
  - titre: "On commence l'aventure"
    texte: "On met en place ton coaching et c'est parti."
cta_final:
  titre: "On parle de ton objectif ?"
  texte: "Peu importe ton niveau ou ton point de départ. Dis-nous où tu veux aller et construisons la suite ensemble."
