hero:
  accroche: "Ton coaching sportif, construit autour de toi."
  presentation: "Course à pied, triathlon ou préparation physique : que tu débutes, que tu reprennes ou que tu vises un objectif d'endurance, on construit ensemble l'accompagnement qui te correspond."
  photo: "/images/photos/elo-guillaume.webp"
  photo_alt: "Elo et Guillaume, coachs Endurall"
philosophie:
  titre: "Un coaching qui part de toi."
  piliers:
    - titre: "Un coaching personnalisable"
      texte: "Ton entraînement doit s'adapter à ton niveau, tes objectifs et ton quotidien."
    - titre: "Bien plus que des sports d'endurance"
      texte: "Running, triathlon, préparation physique, renforcement ou remise en forme : l'objectif est de construire un sportif plus complet."
    - titre: "On part de toi et on construit ensemble"
      texte: "Pas de programme générique appliqué à tout le monde. On échange, on construit, on analyse et on adapte."
# Bandeau d'avis Google (sous « Un coaching qui part de toi »).
